<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Classroom Editor</title>
<script src="coi-serviceworker.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:#111827;color:#e5e7eb}header,.toolbar{display:flex;align-items:center;gap:7px;padding:8px 10px;background:#202938;flex-wrap:wrap}header strong{margin-right:8px}button,select{font:inherit;border:1px solid #526079;background:#364358;color:white;border-radius:5px;padding:5px 9px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){background:#475772}select{max-width:210px}#status{margin-left:auto;font-size:12px;color:#cbd5e1}#notice{display:none;padding:8px 12px;background:#46351b;color:#ffdda0}#layout{flex:1;min-height:0;display:flex}#sidebar{width:220px;min-width:130px;max-width:40vw;display:flex;flex-direction:column;background:#1b2534;border-right:1px solid #42516a}#sidebarHead{padding:9px;display:flex;gap:5px;flex-wrap:wrap}#sidebarHead button{font-size:12px;padding:4px 6px}#tree{overflow:auto;flex:1;padding:4px}#tree button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:3px;padding:5px 7px;font:13px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tree button.active{background:#38506f}#tree button:hover{background:#34445a}#main{flex:1;min-width:0;display:flex;flex-direction:column}#filebar{padding:7px 12px;background:#1c2635;border-bottom:1px solid #40506a;font:13px ui-monospace,monospace}#editor{height:57%;min-height:0;overflow:hidden}.cm-editor{height:100%}#divider{height:9px;background:#46556b;cursor:row-resize;touch-action:none;flex-shrink:0;display:grid;place-items:center}#divider:after{content:"";width:38px;height:3px;background:#cbd5e1;border-radius:4px}#divider:hover,#divider.dragging{background:#64748b}#consolePane{flex:1;min-height:0;display:flex;flex-direction:column;background:#0b1220}#consoleHead{padding:6px 10px;background:#192233;display:flex;align-items:center;justify-content:space-between}#console{flex:1;overflow:auto;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,Consolas,monospace}#console .error{color:#fda4af}#console .inputEcho{color:#93c5fd}#inputRow{display:flex;gap:7px;padding:8px;border-top:1px solid #344256}#stdin{flex:1;min-width:0;background:#182437;border:1px solid #50617c;border-radius:4px;color:white;padding:7px;font:13px monospace}#stdin:disabled{opacity:.45}input[type=file]{display:none}@media(max-width:620px){#sidebar{width:130px;min-width:105px}header{gap:5px}#status{width:100%;margin:0}}
</style></head><body>
<header><strong>Python Editor</strong><select id="projects" aria-label="Project"></select><button id="newProject">New project</button><button id="renameProject">Rename</button><button id="deleteProject">Delete project</button><button id="importZip">Import ZIP</button><button id="exportZip">Export ZIP</button><input id="zipInput" type="file" accept=".zip,application/zip"><button id="run">▶ Run main.py</button><button id="stop" disabled>■ Stop</button><span id="status">Loading…</span></header>
<div id="notice"></div><div id="layout"><aside id="sidebar"><div id="sidebarHead"><button id="newFile">+ File</button><button id="newFolder">+ Folder</button><button id="renameFile">Rename</button><button id="deleteFile">Delete</button></div><div id="tree" aria-label="Project files"></div></aside><main id="main"><div id="filebar">main.py</div><div id="editor"></div><div id="divider" role="separator" aria-label="Resize editor and console" aria-orientation="horizontal" tabindex="0"></div><div id="consolePane"><div id="consoleHead"><strong>Console</strong><button id="clear">Clear</button></div><div id="console" role="log" aria-live="polite"></div><form id="inputRow"><span>❯</span><input id="stdin" autocomplete="off" spellcheck="false" placeholder="Waiting for Python input()…" disabled><button id="send" disabled>Enter</button></form></div></main></div>
<script type="module">
import {EditorView,basicSetup} from 'https://esm.sh/codemirror@6.0.2';
import {python} from 'https://esm.sh/@codemirror/lang-python@6';
import {strToU8,strFromU8,zipSync,unzipSync} from 'https://esm.sh/fflate@0.8.2';
const $=s=>document.querySelector(s), STORE='python-classroom-projects-v2', SPLIT='python-classroom-split-v2';
const starter={id:'default',name:'My first project',active:'main.py',files:{'main.py':'from helpers import greet\n\nname = input("Your name: ")\ngreet(name)\n\nwith open("results.txt", "w") as f:\n    f.write("Hello, " + name + "!\\n")\n','helpers.py':'def greet(name):\n    print(f"Hello, {name}!")\n','data.txt':'Example text file\n'},folders:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
let state;try{state=JSON.parse(localStorage.getItem(STORE))}catch{};
if(!state||!Array.isArray(state.projects)||!state.projects.length)state={selected:'default',projects:[clone(starter)]};
const project=()=>state.projects.find(p=>p.id===state.selected)||state.projects[0];
let worker=null,channel=null,runId=0,waiting=false,saveTimer,loadingDocument=false;
function status(s){$('#status').textContent=s}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));status('Autosaved')}catch(e){status('Storage full / save failed');log('Could not save project: '+e.message+'\n','error')}}
function scheduleSave(){status('Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(persist,500)}
function flush(){clearTimeout(saveTimer);persist()}
function log(s,cls=''){const x=document.createElement('span');if(cls)x.className=cls;x.textContent=s;$('#console').append(x);$('#console').scrollTop=$('#console').scrollHeight}
function cleanPath(s){if(typeof s!=='string')return null;const path=s.replaceAll('\\','/').trim().replace(/^\/+/, '');const parts=path.split('/');if(!path||parts.some(x=>!x||x==='.'||x==='..'||/[\x00-\x1f]/.test(x))||path.length>200||path.startsWith('__pycache__/'))return null;return path}
function allPaths(p){return [...Object.keys(p.files),...p.folders]}
function pathConflict(p,path,exclude){return allPaths(p).some(x=>x!==exclude&&(x===path||x.startsWith(path+'/')||path.startsWith(x+'/')&&x in p.files))}
function ensureParents(p,path){const bits=path.split('/');for(let i=1;i<bits.length;i++){const folder=bits.slice(0,i).join('/');if(!p.folders.includes(folder))p.folders.push(folder)}}
const editor=new EditorView({doc:project().files[project().active]||'',extensions:[basicSetup,python(),EditorView.updateListener.of(u=>{if(u.docChanged&&!loadingDocument){project().files[project().active]=u.state.doc.toString();scheduleSave()}})],parent:$('#editor')});
function switchDocument(path){const p=project();if(!(path in p.files))return;p.active=path;loadingDocument=true;editor.dispatch({changes:{from:0,to:editor.state.doc.length,insert:p.files[path]}});loadingDocument=false;$('#filebar').textContent=path;renderTree();scheduleSave()}
function renderProjects(){$('#projects').replaceChildren();for(const p of state.projects){const o=new Option(p.name,p.id);$('#projects').add(o)}$('#projects').value=project().id}
function renderTree(){const p=project(),tree=$('#tree');tree.replaceChildren();const folders=[...new Set([...p.folders,...Object.keys(p.files).flatMap(path=>{const parts=path.split('/');return parts.slice(1).map((_,i)=>parts.slice(0,i+1).join('/'))})])].sort();for(const f of folders){const b=document.createElement('button');b.textContent='📁 '+f.split('/').at(-1);b.title=f;b.style.paddingLeft=(7+14*(f.split('/').length-1))+'px';b.onclick=()=>{selectedPath=f;renderTree()};if(selectedPath===f)b.classList.add('active');tree.append(b)}for(const path of Object.keys(p.files).sort()){const b=document.createElement('button');b.textContent='📄 '+path.split('/').at(-1);b.title=path;b.style.paddingLeft=(7+14*(path.split('/').length-1))+'px';if(path===p.active)b.classList.add('active');b.onclick=()=>{selectedPath=path;switchDocument(path)};tree.append(b)}}
let selectedPath=project().active;
function refresh(){const p=project();if(!(p.active in p.files))p.active=Object.keys(p.files)[0]||'main.py';if(!(p.active in p.files))p.files[p.active]='';selectedPath=p.active;renderProjects();switchDocument(p.active);flush()}
$('#projects').onchange=e=>{flush();state.selected=e.target.value;refresh()};
$('#newProject').onclick=()=>{const name=prompt('Project name:','New project');if(!name?.trim())return;const p=clone(starter);p.id=crypto.randomUUID();p.name=name.trim();p.files={'main.py':'print("Hello, world!")\n'};p.folders=[];state.projects.push(p);state.selected=p.id;refresh()};
$('#renameProject').onclick=()=>{const p=project(),name=prompt('Project name:',p.name);if(!name?.trim())return;p.name=name.trim();renderProjects();flush()};
$('#deleteProject').onclick=()=>{if(state.projects.length===1){alert('Create another project before deleting this one.');return}if(!confirm('Permanently delete this project from this browser?'))return;state.projects=state.projects.filter(p=>p.id!==state.selected);state.selected=state.projects[0].id;refresh()};
function createPath(folder){const p=project(),raw=prompt(folder?'New folder path:':'New file path:',folder?'utils':'module.py');if(raw===null)return;const path=cleanPath(raw);if(!path||pathConflict(p,path)){alert('Invalid path or name already in use.');return}ensureParents(p,path);if(folder){p.folders.push(path);selectedPath=path;renderTree();flush()}else{p.files[path]='';switchDocument(path);flush()}};
$('#newFile').onclick=()=>createPath(false);$('#newFolder').onclick=()=>createPath(true);
$('#renameFile').onclick=()=>{const p=project(),old=selectedPath;if(!allPaths(p).includes(old))return;const raw=prompt('New path:',old);if(raw===null)return;const path=cleanPath(raw);if(!path||path===old)return;if(pathConflict(p,path,old)){alert('Invalid or conflicting path.');return}const isFolder=p.folders.includes(old);if(isFolder){const mappedFiles={};for(const [k,v] of Object.entries(p.files))mappedFiles[k===old||k.startsWith(old+'/')?path+k.slice(old.length):k]=v;p.files=mappedFiles;p.folders=p.folders.map(k=>k===old||k.startsWith(old+'/')?path+k.slice(old.length):k);if(p.active.startsWith(old+'/'))p.active=path+p.active.slice(old.length)}else{p.files[path]=p.files[old];delete p.files[old];if(p.active===old)p.active=path}ensureParents(p,path);selectedPath=path;refresh()};
$('#deleteFile').onclick=()=>{const p=project(),path=selectedPath;if(!allPaths(p).includes(path))return;if(!confirm('Delete '+path+'?'))return;if(path in p.files){delete p.files[path]}else{for(const k of Object.keys(p.files))if(k.startsWith(path+'/'))delete p.files[k];p.folders=p.folders.filter(f=>f!==path&&!f.startsWith(path+'/'))}if(!Object.keys(p.files).length)p.files['main.py']='';refresh()};
function download(bytes,name,type){const url=URL.createObjectURL(new Blob([bytes],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#exportZip').onclick=()=>{flush();const p=project(),entries={};for(const [path,contents] of Object.entries(p.files))entries[path]=strToU8(contents);for(const folder of p.folders)if(!Object.keys(entries).some(k=>k.startsWith(folder+'/')))entries[folder+'/']=new Uint8Array();download(zipSync(entries),p.name.replace(/[^a-z0-9_-]/gi,'_')+'.zip','application/zip')};
$('#importZip').onclick=()=>$('#zipInput').click();$('#zipInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>10_000_000)throw Error('ZIP too large (10 MB maximum)');const entries=unzipSync(new Uint8Array(await file.arrayBuffer()));const p={id:crypto.randomUUID(),name:file.name.replace(/\.zip$/i,''),files:{},folders:[],active:'main.py'};let total=0;for(const [raw,bytes] of Object.entries(entries)){const path=cleanPath(raw.replace(/\/$/,''));if(!path||raw.startsWith('/')||raw.includes('\\'))continue;if(raw.endsWith('/')){p.folders.push(path);continue}total+=bytes.length;if(total>10_000_000)throw Error('Uncompressed files exceed 10 MB');p.files[path]=strFromU8(bytes);ensureParents(p,path)}if(!Object.keys(p.files).length)throw Error('No readable files in ZIP');if(!('main.py' in p.files))p.active=Object.keys(p.files).sort()[0];state.projects.push(p);state.selected=p.id;refresh()}catch(err){alert('Could not import ZIP: '+err.message)}};
$('#clear').onclick=()=>$('#console').textContent='';
function setRunning(v){$('#run').disabled=v||!supported;$('#stop').disabled=!v}function setWaiting(v){waiting=v;$('#stdin').disabled=!v;$('#send').disabled=!v;if(v){$('#stdin').focus()}else $('#stdin').value=''}
// The worker is embedded to keep the app self-contained apart from the COI helper and CDN libraries.
const workerSource=String.raw`
let pyodide,control,bytes;
const send=(type,extra={})=>postMessage({type,...extra});
function stdin(){Atomics.store(control,0,0);send('input');Atomics.wait(control,0,0);const n=Atomics.load(control,1);if(n<0)throw Error('Input cancelled');return new TextDecoder().decode(bytes.subarray(0,n))+'\n'}
function walk(dir,out){for(const item of pyodide.FS.readdir(dir)){if(item==='.'||item==='..'||item==='__pycache__'||item==='.git')continue;const full=dir+'/'+item,relative=full.slice('/project/'.length);const info=pyodide.FS.stat(full);if(pyodide.FS.isDir(info.mode)){out.folders.push(relative);walk(full,out)}else if(pyodide.FS.isFile(info.mode)){const data=pyodide.FS.readFile(full);if(data.length>2000000)continue;try{out.files[relative]=new TextDecoder('utf-8',{fatal:true}).decode(data)}catch{}}}}
onmessage=async e=>{if(e.data.type!=='run')return;try{control=new Int32Array(e.data.buffer,0,8);bytes=new Uint8Array(e.data.buffer,32);send('loading');importScripts('https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js');pyodide=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.29.3/full/'});pyodide.setStdout({write:b=>{send('stdout',{text:new TextDecoder().decode(b)});return b.length}});pyodide.setStderr({batched:t=>send('stderr',{text:t+'\n'})});pyodide.setStdin({stdin});pyodide.FS.mkdirTree('/project');for(const folder of e.data.folders)pyodide.FS.mkdirTree('/project/'+folder);for(const [path,contents] of Object.entries(e.data.files)){const parts=path.split('/');if(parts.length>1)pyodide.FS.mkdirTree('/project/'+parts.slice(0,-1).join('/'));pyodide.FS.writeFile('/project/'+path,contents)}send('ready');try{await pyodide.runPythonAsync('import os,sys\nos.chdir("/project")\nif "/project" not in sys.path: sys.path.insert(0,"/project")\nwith open("main.py",encoding="utf-8") as f:\n    source=f.read()\nexec(compile(source,"main.py","exec"),{"__name__":"__main__","__file__":"/project/main.py"})')}catch(err){send('stderr',{text:String(err)+'\n'})}const result={files:{},folders:[]};walk('/project',result);send('synced',{result});send('finished')}catch(err){send('stderr',{text:String(err)+'\n'});send('finished')}};`;
const supported=typeof SharedArrayBuffer!=='undefined'&&crossOriginIsolated;
function stop(silent=false){runId++;if(worker){worker.terminate();worker=null}channel=null;setWaiting(false);setRunning(false);if(!silent){status('Stopped');log('\n[Execution stopped; unsynchronized changes may be lost]\n','error')}}
$('#stop').onclick=()=>stop();
$('#run').onclick=()=>{if(!supported)return;flush();const p=project();if(!('main.py' in p.files)){alert('Create main.py before running this project.');return}stop(true);$('#console').textContent='';setRunning(true);status('Loading Python…');const current=++runId,projectId=p.id;channel=new SharedArrayBuffer(32+65536);const url=URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'}));worker=new Worker(url);URL.revokeObjectURL(url);worker.onmessage=e=>{if(current!==runId)return;const {type,text,result}=e.data;if(type==='loading')status('Loading Pyodide…');if(type==='ready')status('Running…');if(type==='stdout')log(text);if(type==='stderr')log(text,'error');if(type==='input')setWaiting(true);if(type==='synced'){const target=state.projects.find(x=>x.id===projectId);if(target){target.files={...result.files};target.folders=[...new Set(result.folders)];if(!(target.active in target.files))target.active=Object.keys(target.files)[0]||'main.py';if(state.selected===projectId){loadingDocument=true;editor.dispatch({changes:{from:0,to:editor.state.doc.length,insert:target.files[target.active]||''}});loadingDocument=false;$('#filebar').textContent=target.active;renderTree()}flush()}}if(type==='finished'){setWaiting(false);setRunning(false);status('Finished');worker?.terminate();worker=null;channel=null}};worker.onerror=e=>{if(current!==runId)return;log('Worker error: '+e.message+'\n','error');stop(true);status('Execution failed')};worker.postMessage({type:'run',files:clone(p.files),folders:[...p.folders],buffer:channel})};
$('#inputRow').onsubmit=e=>{e.preventDefault();if(!waiting||!channel)return;const text=$('#stdin').value,encoded=new TextEncoder().encode(text),control=new Int32Array(channel,0,8),bytes=new Uint8Array(channel,32);if(encoded.length>bytes.length){log('[Input too long]\n','error');return}bytes.set(encoded);Atomics.store(control,1,encoded.length);log(text+'\n','inputEcho');setWaiting(false);Atomics.store(control,0,1);Atomics.notify(control,0,1)};
const divider=$('#divider'),editorEl=$('#editor'),main=$('#main');function split(p){p=Math.max(12,Math.min(88,p));editorEl.style.height=p+'%';editorEl.style.flexShrink='0';return p}const saved=Number(localStorage.getItem(SPLIT));split(saved>=12&&saved<=88?saved:57);let dragging=false;divider.onpointerdown=e=>{if(e.button!==0)return;dragging=true;divider.setPointerCapture(e.pointerId);divider.classList.add('dragging')};divider.onpointermove=e=>{if(!dragging)return;const r=main.getBoundingClientRect();split((e.clientY-r.top-$('#filebar').offsetHeight)/(r.height-$('#filebar').offsetHeight)*100)};function finish(){if(!dragging)return;dragging=false;divider.classList.remove('dragging');localStorage.setItem(SPLIT,editorEl.getBoundingClientRect().height/(main.getBoundingClientRect().height-$('#filebar').offsetHeight)*100)}divider.onpointerup=finish;divider.onpointercancel=finish;divider.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const p=editorEl.getBoundingClientRect().height/(main.getBoundingClientRect().height-$('#filebar').offsetHeight)*100;localStorage.setItem(SPLIT,split(p+(e.key==='ArrowDown'?3:-3)))}};
if(!supported){$('#notice').style.display='block';$('#notice').textContent='Python execution requires cross-origin isolation. Deploy with coi-serviceworker.js on GitHub Pages (HTTPS), or serve with COOP/COEP headers. Editing and ZIP export still work.';$('#run').disabled=true}refresh();if(!supported)status('Execution unavailable: hosting setup needed');
</script></body></html>
